<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:'Segoe UI',sans-serif;background:#fafafa;padding:40px}
.box{display:flex;gap:40px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid #eee;border-radius:16px;padding:30px;margin-bottom:24px}
.box.dark{background:#1b1f2a}
.word{font-size:32px;font-weight:800;color:#212121;letter-spacing:-.5px}
.word .m{font-weight:400;color:#6b7280}
.dark .word{color:#fff}.dark .word .m{color:#9aa0ad}
h3{font-family:sans-serif;color:#888;font-size:13px}
</style></head><body>
<h3>FINAL ICON — multiple sizes (light)</h3>
<div class="box">
  <img src="neuromedica-icon.svg" width="120" height="120">
  <img src="neuromedica-icon.svg" width="64" height="64">
  <img src="neuromedica-icon.svg" width="40" height="40">
  <img src="neuromedica-icon.svg" width="24" height="24">
  <img src="neuromedica-icon.svg" width="16" height="16">
</div>
<h3>HORIZONTAL LOCKUP</h3>
<div class="box">
  <img src="neuromedica-icon.svg" width="56" height="56">
  <span class="word">Neuro<span class="m">Medica</span></span>
</div>
<div class="box dark">
  <img src="neuromedica-icon.svg" width="56" height="56">
  <span class="word">Neuro<span class="m">Medica</span></span>
</div>
</body></html>
